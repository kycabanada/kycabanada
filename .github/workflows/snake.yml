# Draws a snake eating the contribution graph, once a day.
# The images are pushed to the "output" branch and shown in the README.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1b6e8a&color_dots=#e9f1f4,#b7dce8,#6ec1da,#1b6e8a,#12263a
            dist/snake-dark.svg?palette=github-dark&color_snake=#f4b41a&color_dots=#161b22,#173a4b,#1b6e8a,#6ec1da,#e8eff3

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
