<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Kristine Cabanada, full-stack web developer">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse { transform-origin: 1072px 246px; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1c1c1c" />
    </pattern>
    <radialGradient id="glow" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#f4b41a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f4b41a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0a0a0a" />
  <rect width="1200" height="320" rx="16" fill="url(#dots)" />
  <rect width="1200" height="320" rx="16" fill="url(#glow)" />

  <!-- Eyebrow -->
  <rect x="72" y="62" width="28" height="4" rx="2" fill="#f4b41a" />
  <text x="112" y="69" class="mono" font-size="15" letter-spacing="2.5" fill="#a3a3a3">BS INFORMATION TECHNOLOGY · UNIVERSITY OF SANTO TOMAS</text>

  <!-- Name -->
  <text x="70" y="138" class="sans" font-size="66" font-weight="800" letter-spacing="-2" fill="#ffffff">Kristine Cabanada<tspan fill="#f4b41a">.</tspan></text>

  <!-- Tagline -->
  <text x="72" y="178" class="sans" font-size="22" fill="#d4d4d4">Full-stack web developer · I build web apps and the databases behind them.</text>

  <!-- Route: one stop per project, oldest to newest -->
  <line x1="96" y1="246" x2="1072" y2="246" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round" />
  <line x1="96" y1="246" x2="1072" y2="246" stroke="#e5e5e5" stroke-width="3" stroke-linecap="round" stroke-dasharray="976" stroke-dashoffset="0" opacity="0.9" />

  <g class="mono" font-size="13" fill="#8a8a8a" text-anchor="middle">
    <circle cx="96" cy="246" r="7" fill="#0a0a0a" stroke="#e5e5e5" stroke-width="3" />
    <text x="96" y="278" fill="#e5e5e5" class="sans" font-size="14" font-weight="600">Shelter of Light</text>
    <text x="96" y="296">2025</text>

    <circle cx="340" cy="246" r="7" fill="#0a0a0a" stroke="#e5e5e5" stroke-width="3" />
    <text x="340" y="278" fill="#e5e5e5" class="sans" font-size="14" font-weight="600">Café Alnardo</text>
    <text x="340" y="296">2025</text>

    <circle cx="584" cy="246" r="7" fill="#0a0a0a" stroke="#e5e5e5" stroke-width="3" />
    <text x="584" y="278" fill="#e5e5e5" class="sans" font-size="14" font-weight="600">WellByte</text>
    <text x="584" y="296">2026</text>

    <circle cx="828" cy="246" r="7" fill="#0a0a0a" stroke="#e5e5e5" stroke-width="3" />
    <text x="828" y="278" fill="#e5e5e5" class="sans" font-size="14" font-weight="600">Solteira</text>
    <text x="828" y="296">2026</text>

    <circle class="pulse" cx="1072" cy="246" r="9" fill="#f4b41a" />
    <circle cx="1072" cy="246" r="9" fill="#f4b41a" stroke="#0a0a0a" stroke-width="2" />
    <text x="1072" y="278" fill="#f4b41a" class="sans" font-size="14" font-weight="700">AGOS</text>
    <text x="1072" y="296" fill="#f4b41a">NOW</text>
  </g>
</svg>
